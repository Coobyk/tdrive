name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must exist)"
        required: true
      publish:
        description: "Create or update the GitHub release"
        type: boolean
        default: true
        required: true

permissions:
  contents: write

env:
  BIN: tdrive

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tdrive-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tdrive-windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tdrive-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: tdrive-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfuse3-dev libfontconfig-dev libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VER="${{ inputs.tag || github.ref_name }}"; VER="${VER#v}"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: Package (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN}" dist/
          mkdir -p dist/packaging
          cp packaging/tdrive.desktop packaging/tdrive.svg dist/packaging/
          cp -r packaging/hicolor dist/packaging/
          VER="${{ steps.version.outputs.ver }}"
          tar -czf "${{ matrix.artifact }}-$VER.tar.gz" -C dist .
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN}" dist/
          VER="${{ steps.version.outputs.ver }}"
          tar -czf "${{ matrix.artifact }}-$VER.tar.gz" -C dist .
          bash packaging/macos/make-dmg.sh "$VER" "target/${{ matrix.target }}/release/${BIN}" "${{ matrix.artifact }}-$VER.dmg"
      - name: Setup .NET for WinUI 3
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build Windows core DLL (WinUI 3)
        if: runner.os == 'Windows'
        run: cargo build --release --locked --manifest-path windows/core/Cargo.toml
      - name: Install Windows installer tooling
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --version 3.13.0 --no-progress -y
          dotnet tool install --global wix --version 4.0.6
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build-windows-packages.ps1 -Version "${{ steps.version.outputs.ver }}"
          pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build-windows-winui-packages.ps1 -Version "${{ steps.version.outputs.ver }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ steps.version.outputs.ver }}
          path: |
            ${{ matrix.artifact }}-*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - name: NDK + cargo-ndk
        run: |
          # ubuntu-latest ships the SDK + cmdline-tools already.
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          cargo install cargo-ndk
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build native core
        working-directory: android/core
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o ../app/src/main/jniLibs build --release
      - name: Signing material (optional)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_ALIAS_PASS: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::warning::no signing secrets — unsigned APK"; exit 0; fi
          echo "$KS_B64" | base64 -d > tdrive-release.keystore
          printf 'tdrive.storeFile=tdrive-release.keystore\ntdrive.storePassword=%s\ntdrive.keyAlias=%s\ntdrive.keyPassword=%s\n' \
            "$KS_PASS" "$KS_ALIAS" "$KS_ALIAS_PASS" > local.properties
      - name: Assemble APK
        run: |
          ./gradlew :app:assembleRelease
          VER="${{ inputs.tag || github.ref_name }}"
          cp app/build/outputs/apk/release/app-release.apk "tdrive-android-${VER#v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: tdrive-android-apk
          path: android/tdrive-android-*.apk

  publish:
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tdrive-*
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release create "$TAG" tdrive-* \
            --repo "${{ github.repository }}" \
            --title "tdrive $TAG" --generate-notes --verify-tag || \
          gh release upload "$TAG" tdrive-* --clobber --repo "${{ github.repository }}"

  aur:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AUR SSH setup
        run: |
          install -d -m700 ~/.ssh
          printf '%s\n' '${{ secrets.AUR_SSH_KEY }}' > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'CFG'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          CFG
          git config --global user.name "Coobyk"
          git config --global user.email "mail@coobyk.com"
      - name: Publish tdrive + tdrive-bin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ inputs.tag || github.ref_name }}"; VER="${VER#v}"
          SHA_SRC=$(curl -sL "https://github.com/${{ github.repository }}/archive/v$VER.tar.gz" | sha256sum | cut -d' ' -f1)
          SHA_BIN=$(gh release download "v$VER" -p 'tdrive-linux-x86_64-*' --repo "${{ github.repository }}" -O- --clobber 2>/dev/null | sha256sum | cut -d' ' -f1)
          publish_pkg() {
            pkg=$1 sha=$2
            work=$(mktemp -d)
            # Clone existing pkgbase or init — first push creates the package.
            if git clone -q "ssh://aur@aur.archlinux.org/$pkg.git" "$work/$pkg"; then
              # Fresh pkgbase clones are empty — HEAD is unborn master.
              git -C "$work/$pkg" checkout -qb master 2>/dev/null || true
            else
              mkdir "$work/$pkg"
              git -C "$work/$pkg" init -qb master
              git -C "$work/$pkg" remote add origin "ssh://aur@aur.archlinux.org/$pkg.git"
            fi
            sed -e "s/@PKGVER@/$VER/" -e "s/@SHA256@/$sha/" \
              "aur/$pkg/PKGBUILD" > "$work/$pkg/PKGBUILD"
            python3 aur/mk_srcinfo.py "$work/$pkg/PKGBUILD" > "$work/$pkg/.SRCINFO"
            git -C "$work/$pkg" add -A
            git -C "$work/$pkg" commit -qm "$pkg $VER" || echo "no changes"
            git -C "$work/$pkg" push -q origin master
          }
          publish_pkg tdrive "$SHA_SRC"
          publish_pkg tdrive-bin "$SHA_BIN"
