[package]
name = "tdrive"
version = "0.3.7"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-channel = "2.5.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
dirs = "7.0.0"
futures-util = "0.3.34"
gpui = "0.2.2"
grammers-client = "0.12.0"
grammers-session = { version = "0.12.0", features = ["sqlite-storage"] }
hkdf = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
libc = "0.2.191"
rand = "0.10.3"
md5 = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
urlencoding = "2.1.3"
uuid = { version = "1.29.2", features = ["v4"] }

[patch.crates-io]
# xattr 0.2.3 fails on libc >= 0.2.191: ENOATTR was removed on Linux, where
# ENODATA is the same constant (61). Patched locally until zed-async-tar
# relaxes its pin.
xattr = { path = "vendor/xattr" }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.18.0"
ksni = { version = "0.3.7", features = ["blocking"] }
