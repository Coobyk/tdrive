[package]
name = "tdrive-core"
version = "0.3.9"
edition = "2024"

[lib]
name = "tdrive_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
tdrive = { path = "../..", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync"] }
